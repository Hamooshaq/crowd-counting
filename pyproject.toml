[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-detection-stage2"
version = "0.1.0"
description = "Stage 2 crowd counting pipeline with baseline and advanced CSRNet variants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "scipy>=1.11",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

